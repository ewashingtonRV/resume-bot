[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "resume-bot"
version = "0.1.0"
description = "Resume Bot with FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.0",
    "nest_asyncio>=1.6.0",
    "anthropic>=0.79.0",
    "requests>=2.32.0",
    "streamlit>=1.45.0",
    "ipykernel>=6.29.5",
]
